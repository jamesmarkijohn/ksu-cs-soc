---
- name: Kali GUI via VNC (XFCE + TigerVNC) for Guacamole
  hosts: attacker-host:soc-host:enterprise-host-linux
  become: true
  vars:
    vnc_user: kali
    kali_password: "nZIGzd7G&2"
    vnc_password: "{{ (((kypo_global_sandbox_id | default(ansible_machine_id) | default(inventory_hostname)) ~ 'v73efn#woPs') | hash('sha1'))[:12] }}"
    vnc_display: "1"
    vnc_geometry: "1280x720"
    vnc_depth: "24"
    allow_vnc_nonlocal: true
    vnc_localhost_flag: "{{ '-localhost no' if allow_vnc_nonlocal else '-localhost yes' }}"
    vnc_cfg_dir: "/home/{{ vnc_user }}/.config/tigervnc"

  handlers:
    - name: restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  tasks:
    - name: Ensure bootstrap SSH user exists (CRCZP key-based access)
      ansible.builtin.user:
        name: user
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true

    - name: Allow CRCZP-generated SSH public key for bootstrap user
      ansible.builtin.authorized_key:
        user: user
        state: present
        key: "{{ lookup('file', global_ssh_public_user_key) }}"

    - name: Allow passwordless sudo for bootstrap user (no password set)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-crczp-bootstrap-user
        owner: root
        group: root
        mode: "0440"
        content: |
          user ALL=(ALL) NOPASSWD:ALL

    - name: Disable password-based SSH authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/90-crczp-keyonly.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PubkeyAuthentication yes
      notify: restart ssh

    - name: Lock password login for default accounts (no default credentials)
      ansible.builtin.user:
        name: "{{ item }}"
        password_lock: true
      loop:
        - "{{ vnc_user }}"
        - root

    - name: Set kali user login password
      ansible.builtin.user:
        name: "{{ vnc_user }}"
        password: "{{ kali_password | password_hash('sha512') }}"

    - name: Lock password login for root only (no default root credentials)
      ansible.builtin.user:
        name: root
        password_lock: true

    - name: Install XFCE + TigerVNC
      ansible.builtin.apt:
        update_cache: true
        name:
          - xfce4
          - xfce4-goodies
          - dbus-x11
          - xauth
          - tigervnc-standalone-server
          - tigervnc-common
        state: present

    - name: Ensure TigerVNC config dir exists
      ansible.builtin.file:
        path: "{{ vnc_cfg_dir }}"
        state: directory
        owner: "{{ vnc_user }}"
        group: "{{ vnc_user }}"
        mode: "0700"

    - name: Ensure ~/.vnc exists
      ansible.builtin.file:
        path: "/home/{{ vnc_user }}/.vnc"
        state: directory
        owner: "{{ vnc_user }}"
        group: "{{ vnc_user }}"
        mode: "0700"

    - name: Set VNC password file
      ansible.builtin.shell: |
        set -euo pipefail
        printf "%s\n" "{{ vnc_password }}" | vncpasswd -f > "{{ vnc_cfg_dir }}/passwd"
        chown "{{ vnc_user }}:{{ vnc_user }}" "{{ vnc_cfg_dir }}/passwd"
        chmod 0600 "{{ vnc_cfg_dir }}/passwd"
      args:
        executable: /bin/bash

    - name: Set xstartup to launch XFCE (with dbus-launch)
      ansible.builtin.copy:
        dest: "{{ vnc_cfg_dir }}/xstartup"
        owner: "{{ vnc_user }}"
        group: "{{ vnc_user }}"
        mode: "0755"
        content: |
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-launch --exit-with-session startxfce4

    - name: Remove stale VNC/X locks for display :{{ vnc_display }}
      ansible.builtin.shell: |
        rm -f /tmp/.X{{ vnc_display }}-lock /tmp/.X11-unix/X{{ vnc_display }} || true
        rm -f /home/{{ vnc_user }}/.vnc/*:{{ vnc_display }}.pid || true
        rm -f {{ vnc_cfg_dir }}/*:{{ vnc_display }}.pid || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install vncserver@.service
      ansible.builtin.copy:
        dest: /etc/systemd/system/vncserver@.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=TigerVNC server on display :%i
          After=network.target

          [Service]
          Type=simple
          User={{ vnc_user }}
          PAMName=login
          WorkingDirectory=/home/{{ vnc_user }}

          ExecStartPre=-/usr/bin/vncserver -kill :%i
          ExecStart=/usr/bin/vncserver :%i -fg -geometry {{ vnc_geometry }} -depth {{ vnc_depth }} {{ vnc_localhost_flag }}
          ExecStop=/usr/bin/vncserver -kill :%i

          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start VNC on :{{ vnc_display }} (TCP 590{{ vnc_display }}) with diagnostics on failure
      block:
        - name: Start VNC service
          ansible.builtin.systemd:
            name: "vncserver@{{ vnc_display }}"
            state: started
            enabled: true

      rescue:
        - name: systemctl status vncserver@{{ vnc_display }}
          ansible.builtin.command: "systemctl status vncserver@{{ vnc_display }} --no-pager -l"
          register: vnc_status
          changed_when: false
          failed_when: false

        - name: journalctl for vncserver@{{ vnc_display }}
          ansible.builtin.command: "journalctl -xeu vncserver@{{ vnc_display }} --no-pager -n 200"
          register: vnc_journal
          changed_when: false
          failed_when: false

        - name: List ~/.vnc and ~/.config/tigervnc and show last 200 lines of logs
          ansible.builtin.shell: |
            set -e
            echo "### ls -la /home/{{ vnc_user }}/.vnc"
            ls -la /home/{{ vnc_user }}/.vnc || true
            echo
            echo "### ls -la {{ vnc_cfg_dir }}"
            ls -la {{ vnc_cfg_dir }} || true
            echo
            echo "### tail of VNC logs (both locations)"
            (ls -1 /home/{{ vnc_user }}/.vnc/*.log 2>/dev/null; ls -1 {{ vnc_cfg_dir }}/*.log 2>/dev/null) \
              | sort -u | tail -n 10 | while read f; do
                echo "----- $f -----"
                tail -n 200 "$f" || true
              done
          args:
            executable: /bin/bash
          register: vnc_files
          changed_when: false
          failed_when: false

        - name: Print diagnostics
          ansible.builtin.debug:
            msg: |
              ===== systemctl status =====
              {{ vnc_status.stdout | default('') }}
              {{ vnc_status.stderr | default('') }}

              ===== journalctl =====
              {{ vnc_journal.stdout | default('') }}
              {{ vnc_journal.stderr | default('') }}

              ===== ~/.vnc + ~/.config/tigervnc logs =====
              {{ vnc_files.stdout | default('') }}
              {{ vnc_files.stderr | default('') }}

        - name: Fail provisioning with captured diagnostics
          ansible.builtin.fail:
            msg: "VNC service failed to start; see diagnostics above."

- name: Configure enterprise file server (SMB/Samba shared storage)
  hosts: enterprise-file
  become: true
  vars:
    corp_files_group: corpfiles
    corp_files_path: /mnt/corp-files
    smb_user: fileserver
    smb_admin: fileserver-admin
    smb_password: "ChangeMe-CorpFiles-2026!"   # temporary, will remove later
    enterprise_network_cidr: 10.10.10.0/24
    crczp_mgmt_cidr: 192.168.128.0/17          # CRCZP provisioning uses this subnet, it must be allowed

  tasks:
    - name: Install Samba
      ansible.builtin.apt:
        name: samba
        state: present
        update_cache: true

    - name: Ensure corp-files group exists
      ansible.builtin.group:
        name: "{{ corp_files_group }}"
        state: present

    - name: Create shared corp-files directory
      ansible.builtin.file:
        path: "{{ corp_files_path }}"
        state: directory
        owner: root
        group: "{{ corp_files_group }}"
        mode: "2775"

    - name: Create local fileserver system account (no shell login)
      ansible.builtin.user:
        name: "{{ smb_user }}"
        groups: "{{ corp_files_group }}"
        append: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create local fileserver-admin account
      ansible.builtin.user:
        name: "{{ smb_admin }}"
        groups: "{{ corp_files_group }}"
        append: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Set Samba password for fileserver account
      ansible.builtin.shell: |
        (echo "{{ smb_password }}"; echo "{{ smb_password }}") | smbpasswd -s -a "{{ smb_user }}"
      no_log: true
      changed_when: true

    - name: Set Samba password for fileserver-admin
      ansible.builtin.shell: |
        (echo "{{ smb_password }}"; echo "{{ smb_password }}") | smbpasswd -s -a "{{ smb_admin }}"
      no_log: true
      changed_when: true

    - name: Enable and unlock the Samba user
      ansible.builtin.command: smbpasswd -e "{{ smb_user }}"
      changed_when: true

    - name: Enable and unlock the Samba admin
      ansible.builtin.command: smbpasswd -e "{{ smb_admin }}"
      changed_when: true

    - name: Configure Samba share
      ansible.builtin.blockinfile:
        path: /etc/samba/smb.conf
        marker: "# {mark} ANSIBLE MANAGED BLOCK - corp-files share"
        block: |
          [corp-files]
          path = {{ corp_files_path }}
          valid users = @{{ corp_files_group }}
          force group = {{ corp_files_group }}
          create mask = 0664
          directory mask = 2775
          read only = no
          browseable = yes
      notify: restart smbd

    - name: Ensure iptables-persistent is installed
      ansible.builtin.apt:
        name: iptables-persistent
        state: present

    - name: Allow SMB (445) from the CRCZP management network
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "445"
        source: "{{ crczp_mgmt_cidr }}"
        jump: ACCEPT
        comment: "CRCZP management network"

    - name: Allow SMB (445) from the enterprise network (incl. SOC)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "445"
        source: "{{ enterprise_network_cidr }}"
        jump: ACCEPT
        comment: "Allow SMB from enterprise + SOC network"

    - name: Allow legacy NetBIOS session (139) from enterprise network
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "139"
        source: "{{ enterprise_network_cidr }}"
        jump: ACCEPT
        comment: "Allow NetBIOS session from enterprise + SOC network"

    - name: Drop SMB (445) from everywhere else
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "445"
        jump: DROP
        comment: "Block SMB from outside enterprise network"

    - name: Drop NetBIOS (139) from everywhere else
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "139"
        jump: DROP
        comment: "Block NetBIOS from outside enterprise network"

    - name: Save iptables rules
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      changed_when: false

  handlers:
    - name: restart smbd
      ansible.builtin.service:
        name: smbd
        state: restarted

- name: Enforce isolation between attacker-net and enterprise/SOC networks
  hosts: enterprise-router:attacker-router
  become: true
  vars:
    attacker_cidr: 192.168.1.0/24
    enterprise_cidr: 10.10.10.0/24   # covers enterprise-host-net, enterprise-prod-net, and soc-net

  tasks:
    - name: Ensure iptables-persistent is installed
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true

    - name: Drop forwarded traffic from attacker-net to enterprise/SOC network
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: all
        source: "{{ attacker_cidr }}"
        destination: "{{ enterprise_cidr }}"
        jump: DROP
        comment: "Isolate attacker-net from enterprise/SOC network"

    - name: Drop forwarded traffic from enterprise/SOC network to attacker-net
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: all
        source: "{{ enterprise_cidr }}"
        destination: "{{ attacker_cidr }}"
        jump: DROP
        comment: "Isolate enterprise/SOC network from attacker-net"

    - name: Save iptables rules
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      changed_when: false

- name: VXLAN overlay for 802.1Q trunking between enterprise-router and enterprise-host-linux (proof of concept)
  hosts: enterprise-router:enterprise-host-linux
  become: true
  vars:
    vxlan_id: 100
    vxlan_dstport: 4789
    trunk_bridge: br-trunk
    trunk_mtu: 1400
    vxlan_nodes:
      enterprise-router:
        real_ip: 10.10.10.1
        vlan10_cidr: 172.16.99.1/30
        vlan20_cidr: 172.16.99.5/30
      enterprise-host-linux:
        real_ip: 10.10.10.10
        vlan10_cidr: 172.16.99.2/30
        vlan20_cidr: 172.16.99.6/30

  tasks:
    - name: Gather current facts
      ansible.builtin.setup:

    - name: Determine this node's real IP and test VLAN addresses
      ansible.builtin.set_fact:
        my_real_ip: "{{ vxlan_nodes[inventory_hostname].real_ip }}"
        my_vlan10_cidr: "{{ vxlan_nodes[inventory_hostname].vlan10_cidr }}"
        my_vlan20_cidr: "{{ vxlan_nodes[inventory_hostname].vlan20_cidr }}"

    - name: Determine the peer node's real IP
      ansible.builtin.set_fact:
        peer_real_ip: "{{ vxlan_nodes[(vxlan_nodes.keys() | list | difference([inventory_hostname]))[0]].real_ip }}"

    - name: Identify the physical interface currently holding {{ my_real_ip }}
      ansible.builtin.set_fact:
        vlan_parent_iface: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when: >
        ansible_facts[item] is defined and
        ansible_facts[item].ipv4 is defined and
        ansible_facts[item].ipv4.address == my_real_ip

    - name: Fail early if the parent interface could not be identified
      ansible.builtin.fail:
        msg: "Could not find an interface holding {{ my_real_ip }} - check vxlan_nodes."
      when: vlan_parent_iface is not defined

    - name: Ensure the vxlan and 8021q kernel modules are loaded
      ansible.builtin.command: "modprobe {{ item }}"
      args:
        creates: "/sys/module/{{ item }}"
      loop:
        - vxlan
        - 8021q

    - name: Create the VXLAN tunnel to the peer
      ansible.builtin.command:
        cmd: >
          ip link add {{ trunk_bridge }}-vxlan type vxlan id {{ vxlan_id }}
          remote {{ peer_real_ip }} dstport {{ vxlan_dstport }} dev {{ vlan_parent_iface }}
        creates: "/sys/class/net/{{ trunk_bridge }}-vxlan"

    - name: Set MTU on the VXLAN interface
      ansible.builtin.command: "ip link set {{ trunk_bridge }}-vxlan mtu {{ trunk_mtu }}"
      changed_when: true

    - name: Bring the VXLAN interface up
      ansible.builtin.command: "ip link set {{ trunk_bridge }}-vxlan up"
      changed_when: true

    - name: Create the trunk bridge
      ansible.builtin.command:
        cmd: "ip link add name {{ trunk_bridge }} type bridge"
        creates: "/sys/class/net/{{ trunk_bridge }}"

    - name: Attach the VXLAN tunnel to the trunk bridge
      ansible.builtin.command: "ip link set {{ trunk_bridge }}-vxlan master {{ trunk_bridge }}"
      changed_when: true

    - name: Bring the trunk bridge up
      ansible.builtin.command: "ip link set {{ trunk_bridge }} up"
      changed_when: true

    - name: Create tagged VLAN sub-interfaces (10 and 20) on top of the trunk bridge
      ansible.builtin.command:
        cmd: "ip link add link {{ trunk_bridge }} name {{ trunk_bridge }}.{{ item }} type vlan id {{ item }}"
        creates: "/sys/class/net/{{ trunk_bridge }}.{{ item }}"
      loop:
        - 10
        - 20

    - name: Set MTU and bring each tagged sub-interface up
      ansible.builtin.command: "ip link set {{ trunk_bridge }}.{{ item }} mtu {{ trunk_mtu }} up"
      changed_when: true
      loop:
        - 10
        - 20

    - name: Assign test addresses to VLAN 10
      ansible.builtin.command: "ip addr add {{ my_vlan10_cidr }} dev {{ trunk_bridge }}.10"
      register: vlan10_addr
      failed_when: vlan10_addr.rc != 0 and 'File exists' not in vlan10_addr.stderr
      changed_when: vlan10_addr.rc == 0

    - name: Assign test addresses to VLAN 20
      ansible.builtin.command: "ip addr add {{ my_vlan20_cidr }} dev {{ trunk_bridge }}.20"
      register: vlan20_addr
      failed_when: vlan20_addr.rc != 0 and 'File exists' not in vlan20_addr.stderr
      changed_when: vlan20_addr.rc == 0
